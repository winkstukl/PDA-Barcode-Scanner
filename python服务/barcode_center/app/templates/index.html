<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>{{ app_name }}</title>
	<link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
	<div class="container">
		<header class="header">
			<h1>{{ app_name }}</h1>
			<p>条码识别中心 | MQTT + 商品库 + QT 联动</p>
		</header>

		<section class="card">
			<h2>MQTT 状态</h2>

			<div class="status-grid">
				<div><strong>连接状态：</strong><span id="mqtt-connected">--</span></div>
				<div><strong>MQTT 主机：</strong><span id="mqtt-host">--</span></div>
				<div><strong>结果主题：</strong><span id="mqtt-topic-result">--</span></div>
				<div><strong>命令主题：</strong><span id="mqtt-topic-cmd">--</span></div>
				<div><strong>最后消息时间：</strong><span id="mqtt-last-time">--</span></div>
				<div><strong>最后错误：</strong><span id="mqtt-last-error">--</span></div>
			</div>

			<div class="payload-box">
				<div>
					<h3>最近收到的 MQTT 消息</h3>
					<pre id="last-incoming">--</pre>
				</div>
				<div>
					<h3>最近发给 QT 的消息</h3>
					<pre id="last-outgoing">--</pre>
				</div>
			</div>
		</section>

		<section class="card">
			<h2>购物区</h2>

			<div id="notice" class="notice hidden"></div>

			<div class="shop-toolbar">
				<button id="start-shopping-btn" class="btn primary">开始购物</button>
				<button id="reset-shopping-btn" class="btn danger">重置</button>
			</div>

			<div class="shop-summary">
				<div class="summary-box">
					<div class="summary-title">目前总价</div>
					<div class="summary-value" id="current-total">¥0.00</div>
				</div>

				<div class="summary-box">
					<div class="summary-title">结算金额</div>
					<div class="summary-value" id="checkout-total">¥0.00</div>
				</div>
			</div>

			<h3>商品清单</h3>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>条码</th>
							<th>商品名</th>
							<th>QT标签</th>
							<th>单价</th>
							<th>数量</th>
							<th>小计</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="shopping-table-body"></tbody>
				</table>
			</div>
		</section>

		<section class="card">
			<h2>商品库维护</h2>

			<form id="product-form" class="product-form">
				<input type="hidden" id="product-id" />

				<div class="form-row">
					<label>条码</label>
					<input id="barcode" required maxlength="64" placeholder="例如 6901234560015" />
				</div>

				<div class="form-row">
					<label>商品名</label>
					<input id="name" required maxlength="255" placeholder="例如 Mineral Water 1" />
				</div>

				<div class="form-row">
					<label>发给 QT 的标签</label>
					<input id="qt_label" required maxlength="255" placeholder="例如 MINERAL_WATER_1" />
				</div>

				<div class="form-row">
					<label>规格</label>
					<input id="spec" maxlength="255" placeholder="例如 250ml" />
				</div>

				<div class="form-row">
					<label>价格</label>
					<input id="price" type="number" step="0.01" placeholder="例如 3.45" />
				</div>

				<div class="form-row checkbox-row">
					<label>启用</label>
					<input id="enabled" type="checkbox" checked />
				</div>

				<div class="form-actions">
					<button type="submit" class="btn primary">保存商品</button>
					<button type="button" class="btn" id="reset-form-btn">清空表单</button>
				</div>
			</form>

			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>ID</th>
							<th>条码</th>
							<th>商品名</th>
							<th>QT标签</th>
							<th>规格</th>
							<th>价格</th>
							<th>启用</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="product-table-body"></tbody>
				</table>
			</div>
		</section>

		<section class="card">
			<h2>最近识别记录</h2>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>ID</th>
							<th>时间</th>
							<th>条码</th>
							<th>状态</th>
							<th>源状态</th>
							<th>匹配商品</th>
							<th>发给QT</th>
							<th>原始消息</th>
						</tr>
					</thead>
					<tbody id="scan-table-body"></tbody>
				</table>
			</div>
		</section>
	</div>

	<script src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
